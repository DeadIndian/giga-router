name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  screenshots:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install screenshot tools
        run: |
          npm install --prefix "$RUNNER_TEMP/branding-browser" --no-save playwright
          "$RUNNER_TEMP/branding-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Capture dashboard and check responsive layouts
        env:
          NODE_PATH: ${{ runner.temp }}/branding-browser/node_modules
          BRANDING_SCREENSHOT_DIR: ${{ runner.temp }}/branding-screenshots
        run: node scripts/capture-branding.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: branding-screenshots
          path: ${{ runner.temp }}/branding-screenshots
